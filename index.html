*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px 16px 64px;font-family:'Instrument Serif',Georgia,serif;color:var(--ink);background:#858983;position:relative;isolation:isolate}
body::before{content:"";position:fixed;inset:-12px;z-index:-1;pointer-events:none;background:linear-gradient(rgba(37,39,35,.20),rgba(37,39,35,.30)),var(--athenaeum-photo) center/cover no-repeat;filter:blur(5px);transform:scale(1.025)}
a,[data-go],[data-act]{cursor:pointer}
.stage{max-width:1000px;margin:60px auto 0;position:relative}
.stage::before{content:"";position:absolute;left:0;top:-40px;width:52%;height:64px;background:var(--ivory);border-radius:26px 26px 0 0}
.stage.has-project-tabs::before{width:100%;height:54px;border-radius:26px 26px 0 0}
.project-tabs{position:absolute;left:14px;right:14px;top:-40px;z-index:3;display:flex;align-items:flex-end;gap:0;max-width:calc(100% - 28px);overflow-x:auto;scrollbar-width:none}
.project-tabs::-webkit-scrollbar{display:none}
.project-tab{flex:0 0 154px;max-width:154px;height:40px;padding:8px 14px;border:0;border-right:1px solid rgba(80,76,65,.16);border-radius:14px 14px 0 0;background:#d9d2c1;color:#77746c;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:italic 19px 'Cormorant Garamond',serif;cursor:pointer;transition:background .18s,color .18s}
.project-tab:hover:not(.active){background:#e4ddce;color:var(--ink)}
.project-tab.active{background:var(--ivory);color:var(--ink);height:40px}
.project-tab.add{flex:0 0 42px;width:42px;height:40px;padding:0;display:grid;place-items:center;border-right:0;border-radius:12px 12px 0 0;background:#cfc7b5;color:#69685f;text-align:center;font:24px 'Instrument Serif',serif}
.project-tab.add:hover{background:#beb6a4}
.folder{position:relative;background:var(--ivory);border-radius:0 26px 6px 6px;min-height:540px;padding:30px 36px 22px;display:flex;flex-direction:column;box-shadow:0 24px 50px rgba(40,42,38,.28)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:26px}
h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:clamp(30px,6vw,44px);margin:0;line-height:1}.home-title{font-size:clamp(38px,7vw,58px)}
h1 small{display:block;margin-top:4px;font-family:'Instrument Serif',serif;font-style:normal;font-size:11.5px;color:var(--gray);letter-spacing:.03em}
.note{font-size:12.5px;color:var(--gray);text-align:right;letter-spacing:.04em}
.note a{text-decoration:underline;text-underline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px;flex:1;align-content:start}
.card h3{font-weight:400;font-size:17.5px;margin:10px 0 2px;line-height:1.15}
.card p{margin:0;font-size:13px;color:var(--gray)}
.cover{aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:var(--ivory2);box-shadow:0 6px 14px rgba(60,58,50,.2);transition:transform .2s}
.card:hover .cover,.card:focus-visible .cover{transform:translateY(-5px)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.gen{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;line-height:1.1;color:var(--paper)}
.add .cover{background:transparent;border:1.5px dashed var(--gray);box-shadow:none;display:grid;place-items:center;font-size:36px;color:var(--gray)}
.ftile{position:relative;aspect-ratio:4/3;margin-top:14px;background:#cfc7b2;border-radius:0 14px 8px 8px;box-shadow:0 6px 14px rgba(60,58,50,.18);transition:transform .2s}
.ftile::before{content:"";position:absolute;left:0;top:-14px;width:46%;height:18px;background:#cfc7b2;border-radius:10px 10px 0 0}
.ftile::after{content:"";position:absolute;inset:auto 0 0 0;height:78%;background:#ddd5c0;border-radius:0 14px 8px 8px}
.card:hover .ftile{transform:translateY(-5px)}
.memo{align-self:start;background:var(--paper);padding:20px 14px 14px;font-size:14.5px;line-height:23px;color:#6b5a5a;box-shadow:0 4px 10px rgba(60,58,50,.15);position:relative;
background-image:repeating-linear-gradient(transparent 0 22px,#d9c3c3 22px 23px);background-position:0 14px}
.memo::before{content:"";position:absolute;top:-6px;left:50%;width:14px;height:14px;border-radius:50%;background:#8c8a84;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.backbar{display:flex;align-items:center;margin:0 0 18px}
.back-link,.archive-link{display:inline-flex;align-items:center;padding:0;background:transparent;color:var(--gray);text-decoration:none;font:14px 'Instrument Serif',serif;transition:color .18s}
.back-link:hover,.archive-link:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:30px;font-size:14px}
.foot span{margin-left:auto;color:var(--gray);letter-spacing:.3em}
.book{display:grid;grid-template-columns:210px 1fr;gap:34px;flex:1}
.book h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:600;font-size:30px;margin:0 0 2px}
.works{margin:22px 0 14px;border-top:1px solid var(--line)}
.work{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:13px 4px;border-bottom:1px solid var(--line);font-size:18px}
.work:hover{background:var(--ivory2)}
.work em{font-size:13px;color:var(--gray);font-style:normal;white-space:nowrap}
.btn{font:inherit;font-size:15px;background:transparent;border:1.5px solid var(--ink);color:var(--ink);border-radius:999px;padding:6px 18px;cursor:pointer}
.btn:hover,.btn.pri{background:var(--ink);color:var(--paper)}
.read{max-width:640px;margin:0 auto;font-size:19px;line-height:1.75;white-space:normal}
.read p{margin:0 0 1em}
.read ul,.read ol{padding-left:1.5em;margin:.5em 0 1em}
.read blockquote{margin:1em 0;padding-left:1em;border-left:2px solid var(--line);color:var(--gray)}
.read h2,.read h3{font-family:'Cormorant Garamond',serif;line-height:1.2;margin:1em 0 .4em}
.read img{max-width:100%;border-radius:8px;display:block;margin:0 auto}
.rich-field{display:block;margin-bottom:12px}
.rich-field-label{display:block;font-size:14px;color:var(--gray);margin-bottom:4px}
.rich-editor{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;margin-top:6px}
.rich-area{user-select:text;-webkit-user-select:text;cursor:text;touch-action:manipulation}
.rich-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:8px;border-bottom:1px solid var(--line);background:var(--ivory2)}
.rich-tool{min-width:34px;height:32px;padding:0 8px;border:1px solid rgba(110,102,85,.22);border-radius:6px;background:#fff;color:var(--ink);font:13px 'Instrument Serif',serif;cursor:pointer}
.rich-tool:hover{background:#e9e2d2}
.rich-tool.strong{font-weight:700}
.rich-tool.italic{font-style:italic}
.rich-tool.underline{text-decoration:underline}
.rich-separator{width:1px;height:22px;background:var(--line);margin:0 3px}
.rich-area{min-height:220px;max-height:48vh;overflow:auto;padding:13px 14px;color:var(--ink);font:16px/1.7 'Cormorant Garamond',serif;outline:none}
.rich-area:focus{box-shadow:inset 0 0 0 1px rgba(140,130,108,.2)}
.rich-area:empty:before{content:attr(data-placeholder);color:#a7a092;pointer-events:none}
.rich-area p{margin:0 0 .8em}
.rich-value{display:none!important}
.rich-help{display:block;margin-top:6px;color:var(--gray);font-size:11px;font-weight:400}

/* Dedicated reading mode */
.reading-launch{display:flex;justify-content:flex-end;margin:0 0 14px}
.reader-overlay{display:none}
.reader-overlay.is-open{display:flex;position:fixed;inset:0;width:100%;max-width:100vw;z-index:10000;flex-direction:column;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 0 clamp(28px,5vw,64px);background:var(--paper);color:var(--ink)}
.reader-overlay[data-theme="sepia"]{background:#eee6d5;color:#463e31}
.reader-overlay[data-theme="night"]{background:#24231f;color:#e9e1d2}
.reader-toolbar{position:sticky;top:0;z-index:30;isolation:isolate;display:flex;align-items:center;justify-content:space-between;gap:14px;flex:0 0 auto;width:100%;margin:0 0 28px;padding:16px clamp(18px,4vw,48px);border-bottom:1px solid currentColor;background-color:#fbf8ee;box-shadow:0 8px 18px rgba(35,32,25,.09);opacity:1}
.reader-overlay[data-theme="paper"] .reader-toolbar{background-color:#fbf8ee;color:#3a3935}
.reader-overlay[data-theme="sepia"] .reader-toolbar{background-color:#eee6d5;color:#463e31}
.reader-overlay[data-theme="night"] .reader-toolbar{background-color:#24231f;color:#e9e1d2}
.reader-kicker{font:10px 'Instrument Serif',serif;letter-spacing:.16em;opacity:.7}
.reader-actions{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.reader-control{border:1px solid currentColor;border-radius:3px;background:transparent;color:inherit;padding:6px 10px;font:12px 'Instrument Serif',serif;cursor:pointer}
.reader-control:hover{background:rgba(120,110,90,.12)}
.reader-content{width:min(var(--reader-width,700px),calc(100% - 32px));max-width:calc(100% - 32px);min-width:0;margin:0 auto;font-size:var(--reader-size,20px);line-height:1.85;overflow-wrap:anywhere;word-break:normal}
.reader-content.read{width:min(var(--reader-width,700px),calc(100% - 32px));max-width:calc(100% - 32px);min-width:0;font-size:var(--reader-size,20px);line-height:1.85;color:inherit}
.reader-content.read p{margin:0 0 1.15em}
.reader-content.read h2,.reader-content.read h3{color:inherit}
.reader-content.read blockquote{border-color:currentColor;color:inherit;opacity:.78}
.reader-content.read img{max-width:100%;height:auto}
.reader-overlay.reader-wide .reader-content{--reader-width:900px}
.reader-overlay[data-theme="night"] .reader-content.read img{filter:brightness(.92)}
body.reading-mode-active{overflow:hidden}

/* Distraction-free writing mode */
.writer-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 10px;border-top:1px solid var(--line);color:var(--gray);font:11px 'Instrument Serif',serif;letter-spacing:.03em}
.writer-count{font-variant-numeric:tabular-nums}
.rich-tool.writer-toggle{margin-left:auto;white-space:nowrap}
dialog.writing-mode-open{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;max-width:none!important;max-height:none!important;margin:0!important;padding:clamp(14px,3vw,38px)!important;border:0!important;border-radius:0!important;overflow-y:auto!important;background:transparent!important;isolation:isolate}
/* Reuse the same blurred Acropolis photo behind the writing sheet. */
dialog.writing-mode-open::before{content:"";position:fixed;inset:-18px;z-index:-1;pointer-events:none;background:linear-gradient(rgba(247,243,232,.74),rgba(247,243,232,.78)),var(--athenaeum-photo) center/cover no-repeat;filter:blur(5px);transform:scale(1.025)}
dialog.writing-mode-open form{display:flex;flex-direction:column;min-height:100%;width:min(100%,980px);margin:0 auto}
dialog.writing-mode-open form>label{display:none}
dialog.writing-mode-open h2{margin-bottom:18px;font-size:32px}
dialog.writing-mode-open .rich-field{display:flex;flex:1;flex-direction:column;margin:0}
dialog.writing-mode-open .rich-field-label,dialog.writing-mode-open .rich-help{display:none}
dialog.writing-mode-open .rich-editor{display:flex;flex:1;flex-direction:column;min-height:0;margin:0;border-radius:4px}
dialog.writing-mode-open .rich-toolbar{position:sticky;top:0;z-index:2}
dialog.writing-mode-open .rich-area{flex:1;min-height:58vh;max-height:none;padding:clamp(22px,4vw,52px) clamp(18px,9vw,110px);font-size:20px;line-height:1.9}
dialog.writing-mode-open .writer-footer{position:sticky;bottom:0;background:#fff}
dialog.writing-mode-open .btns{position:sticky;bottom:-38px;z-index:3;margin-top:12px;padding:12px 10px;background:rgba(251,248,238,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:8px}
@media(max-width:640px){
  .reader-overlay.is-open{--reader-size:18px}
  .reader-toolbar{align-items:flex-start;flex-direction:column;margin-bottom:18px;padding:14px 16px}
  .reader-actions{justify-content:flex-start;gap:6px}
  .reader-content.read{line-height:1.75;overflow-wrap:anywhere}
  dialog.writing-mode-open .rich-area{min-height:58vh;padding:22px 16px;font-size:18px}
}
.empty{color:var(--gray);padding:14px 4px}
dialog{border:none;border-radius:16px;background:var(--paper);color:var(--ink);padding:24px;width:min(430px,92vw);font-family:inherit}
dialog::backdrop{background:rgba(50,52,48,.5)}
dialog h2{margin:0 0 14px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px}
label{display:block;font-size:14px;color:var(--gray);margin-bottom:12px}
input,textarea,select{display:block;width:100%;margin-top:4px;padding:8px 10px;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media(max-width:640px){.folder{padding:24px 18px 18px}.book{grid-template-columns:1fr}.book .card{max-width:190px}}
 .authline{margin-top:5px;font-size:12px;color:var(--gray)}.authline a{margin-left:7px}.authline a:first-child{margin-left:0} .note{max-width:310px} @media(max-width:640px){.note{max-width:55%;font-size:11px}}
/* Editorial home treatment */
.home-intro{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:28px;align-items:center;margin:4px 0 30px;padding:24px 26px;background:linear-gradient(112deg,rgba(255,252,242,.78),rgba(230,222,201,.55));border:1px solid rgba(150,139,115,.28);border-radius:3px;position:relative;overflow:hidden}
.home-intro:after{content:"";position:absolute;width:220px;height:220px;border:1px solid rgba(140,130,108,.2);border-radius:50%;right:76px;top:-118px;box-shadow:0 0 0 18px rgba(140,130,108,.035),0 0 0 38px rgba(140,130,108,.025);pointer-events:none}
.intro-eyebrow,.section-kicker{font:10px 'Instrument Serif',serif;letter-spacing:.19em;text-transform:uppercase;color:#8c8371}
.intro-handle{display:inline-block;margin-top:10px;font:11px/1.2 "Instrument Serif",serif;letter-spacing:.12em;color:#8c8371}.intro-copy p{max-width:540px;margin:9px 0 0;font:italic clamp(18px,2.5vw,23px)/1.35 'Cormorant Garamond',serif;color:#5d5a52}
.intro-mark{position:relative;z-index:1;text-align:center;border-left:1px solid rgba(140,130,108,.35);padding:4px 0 4px 22px}
.intro-mark strong{display:block;font:italic 58px/.9 'Cormorant Garamond',serif;font-weight:500;color:#8a826f}
.intro-mark span{display:block;margin-top:9px;font-size:10px;letter-spacing:.16em;color:#8c8371}
.collection-heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:0 0 15px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.collection-heading h2{margin:0;font:italic 27px/1 'Cormorant Garamond',serif;font-weight:500}
.collection-count{font-size:11px;letter-spacing:.1em;color:var(--gray);text-align:right}
.home-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:27px}
.home-grid .ftile{margin-top:12px;aspect-ratio:1.35;background:linear-gradient(145deg,#d9d1be,#c7bea9);box-shadow:0 9px 18px rgba(60,58,50,.13)}
.home-grid .ftile:before{background:#c7bea9}
.home-grid .ftile:after{height:82%;background:linear-gradient(145deg,#e3dccb,#d5ccb8);border-top:1px solid rgba(255,255,255,.35)}
.home-grid .card{padding:0 2px}
.home-grid .card h3{font:italic 22px/1.05 'Cormorant Garamond',serif;margin:12px 0 4px}
.home-grid .card p{font-size:12px;letter-spacing:.025em}
.folder-index{position:absolute;z-index:1;right:13px;bottom:10px;font-size:9px;letter-spacing:.14em;color:#928a78}
.home-grid .add .cover{aspect-ratio:1.35!important;margin-top:12px!important;border-radius:0 14px 8px 8px}
.home-colophon{display:flex;justify-content:space-between;gap:12px;margin-top:28px;padding-top:12px;border-top:1px solid var(--line);font-size:10px;letter-spacing:.12em;color:#928a78}
@media(max-width:640px){.home-intro{grid-template-columns:1fr;gap:16px;padding:19px}.intro-mark{display:flex;align-items:center;gap:12px;text-align:left;border-left:0;border-top:1px solid rgba(140,130,108,.35);padding:12px 0 0}.intro-mark strong{font-size:38px}.intro-mark span{margin:0}.home-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.collection-heading h2{font-size:24px}.home-colophon{font-size:9px}}
.cover-credit{margin:5px 0 18px;color:var(--gray);font-size:13px;font-style:italic}
/* Community showcase carousel */
.home-showcase{margin:4px 0 30px}
.showcase-track{display:grid;grid-template-columns:minmax(0,1fr)}
.showcase-slide{grid-area:1/1;min-width:0;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .72s ease}
.showcase-slide.is-active{opacity:1;visibility:visible;pointer-events:auto;z-index:1}
.showcase-slide.welcome-slide .home-intro{margin:0}
.work-slide{position:relative;display:flex;align-items:flex-end;min-height:166px;overflow:hidden;border:1px solid rgba(150,139,115,.32);border-radius:3px;color:#fff;text-decoration:none;background:#777263;isolation:isolate}
.work-slide-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.1s ease}
.work-slide:hover .work-slide-image{transform:scale(1.025)}
.work-slide-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(25,25,22,.72) 0%,rgba(25,25,22,.42) 48%,rgba(25,25,22,.12) 100%),linear-gradient(0deg,rgba(20,20,18,.3),transparent 70%)}
.work-slide-copy{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:24px 28px;max-width:min(760px,90%)}
.work-slide-kicker,.work-slide-link{font:10px 'Instrument Serif',serif;letter-spacing:.16em;color:rgba(255,250,235,.78)}
.work-slide-copy strong{font:italic clamp(25px,4vw,38px)/1.04 'Cormorant Garamond',serif;font-weight:600;color:#fffaf0}
.work-slide-author{font:13px 'Instrument Serif',serif;letter-spacing:.035em;color:rgba(255,250,235,.9)}
.work-slide-caption{font:italic clamp(14px,1.8vw,18px)/1.35 'Cormorant Garamond',serif;color:#fffaf0;white-space:pre-line}
.work-slide-link{margin-top:7px;color:#fffaf0;text-decoration:underline;text-underline-offset:3px}
.showcase-controls{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:9px 2px 0;color:var(--gray)}
.showcase-count{font:10px 'Instrument Serif',serif;letter-spacing:.15em;white-space:nowrap}
.showcase-dots{display:flex;align-items:center;justify-content:center;gap:7px;flex:1}
.showcase-dot{width:6px;height:6px;padding:0;border:0;border-radius:50%;background:#c9c1b1;cursor:pointer;transition:width .2s,background .2s}
.showcase-dot.active{width:19px;border-radius:9px;background:#777263}
.showcase-arrows{display:flex;gap:5px}
.showcase-arrows button{width:27px;height:25px;padding:0;border:1px solid rgba(110,102,85,.28);background:transparent;color:var(--gray);font:20px/1 'Cormorant Garamond',serif;cursor:pointer}
.showcase-arrows button:hover{background:var(--ivory2);color:var(--ink)}
.carousel-admin{margin:20px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--gray)}
.carousel-admin-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.carousel-admin-head>span{font:10px 'Instrument Serif',serif;letter-spacing:.15em}
.carousel-admin-head button{border:0;background:transparent;padding:3px 0;color:var(--gray);font:13px 'Instrument Serif',serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.carousel-admin-head button:hover,.carousel-admin-row a:hover{color:var(--ink)}
.carousel-admin-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid rgba(140,130,108,.16)}
.carousel-admin-row>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.carousel-admin-row a{cursor:pointer;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
@media(max-width:640px){.work-slide{min-height:190px}.work-slide-copy{padding:19px 18px;max-width:96%}.showcase-controls{margin-top:8px}.carousel-admin-row{font-size:11px}}
@media(prefers-reduced-motion:reduce){.showcase-slide,.work-slide-image{transition:none}}


/* Optional linked soundtrack */
.music-toggle{white-space:nowrap}
.music-toggle[aria-expanded="true"]{background:#ded5be;border-color:#a39781}
.music-fields{display:grid;gap:9px;padding:13px 12px 15px;background:#f8f5ed;border-bottom:1px solid var(--line)}
.music-fields[hidden]{display:none!important}
.music-fields label{margin:0;font-size:12px}
.music-fields input{margin-top:4px;font-size:14px;padding:9px 10px;background:#fff}
.music-fields-heading{font:italic 18px 'Cormorant Garamond',serif}
.music-fields-help{font-size:11px;color:var(--gray);line-height:1.5}
.music-fields-remove{justify-self:start;border:0;background:transparent;color:#846f62;font:12px 'Instrument Serif',serif;text-decoration:underline;cursor:pointer;padding:3px 0}
.soundtrack-card{max-width:700px;margin:0 auto 26px;padding:15px 18px;background:#f4f0e6;border:1px solid var(--line);border-radius:5px;color:var(--ink)}
.soundtrack-heading{font:10px 'Instrument Serif',serif;letter-spacing:.15em;color:#8b8374}
.soundtrack-title{margin:6px 0 3px;font:italic 23px/1.18 'Cormorant Garamond',serif}
.soundtrack-artist{margin:0 0 12px;font:13px 'Instrument Serif',serif;opacity:.74}
.soundtrack-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.soundtrack-play{border:1px solid currentColor;background:transparent;color:inherit;border-radius:3px;cursor:pointer;padding:6px 12px;font:12px 'Instrument Serif',serif}
.soundtrack-play:hover{background:rgba(128,118,98,.13)}
.soundtrack-link{font:12px 'Instrument Serif',serif;color:inherit;text-decoration:underline;text-underline-offset:3px}
.soundtrack-player{margin-top:10px}
.soundtrack-player:empty{display:none}
.soundtrack-player iframe{display:block;width:100%;max-width:100%;border:0;border-radius:6px}
.reader-content .soundtrack-card{max-width:100%;background:rgba(120,110,95,.09);border-color:currentColor;color:inherit}
.reader-overlay[data-theme="night"] .soundtrack-heading{color:#c4b6a0}
@media(max-width:640px){.music-fields{padding:11px}.soundtrack-card{padding:13px}}
/* Direct embedded music player, without redundant controls */
.work-music-embed{width:min(100%,480px);max-width:100%;margin:10px auto 28px}
.work-music-embed iframe{display:block;width:100%;max-width:100%;border:0;border-radius:12px;background:transparent}
.work-music-embed.music-youtube{width:min(100%,480px)}
.work-music-embed.music-youtube iframe{aspect-ratio:16/9;height:auto;min-height:190px}
.reader-content .work-music-embed{width:min(100%,480px);margin:4px auto 32px}
@media(max-width:540px){
  .work-music-embed{width:100%;margin:8px auto 24px}
  .reader-content.read .work-music-embed{width:100%;max-width:100%;min-width:0;margin:0 auto 24px}
  .reader-content.read .work-music-embed iframe{display:block;max-width:100%;width:100%;min-width:0}
}

/* The Contributors */
.site-nav{display:flex;flex-wrap:wrap;gap:19px;align-items:center;margin:-12px 0 28px;padding:0 0 13px;border-bottom:1px solid var(--line)}
.site-nav button{border:0;background:none;padding:4px 0;font:12px 'Instrument Serif',serif;letter-spacing:.065em;color:var(--gray);cursor:pointer;text-align:left}
.site-nav button:hover,.site-nav button.is-current{color:var(--ink)}
.site-nav button.is-current{box-shadow:0 1px 0 var(--ink)}

function normalizeTelegramUrl(value){
  const original=String(value||'').trim();
  if(!original)return null;
  let candidate=original;
  if(original.startsWith('@'))candidate='https://t.me/'+original.slice(1);
  else if(/^(?:t\.me|telegram\.me)\//i.test(original))candidate='https://'+original;

function musicEmbedInfo(value){
  const raw=String(value||'').trim();
  if(!raw)return null;
  let url;
  try{url=new URL(raw);}catch(error){return null;}
  if(url.protocol!=='https:'||url.username||url.password)return null;
  const host=url.hostname.toLowerCase();
  if(host==='open.spotify.com'){
    const parts=url.pathname.split('/').filter(Boolean);
    const idx=parts.indexOf('track');
    const id=idx>=0?parts[idx+1]:'';
    if(!/^[A-Za-z0-9]{22}$/.test(id)||idx!==parts.length-2)return null;
    return {platform:'Spotify',link:'https://open.spotify.com/track/'+id,embed:'https://open.spotify.com/embed/track/'+id};
  }
  if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com','youtu.be'].includes(host)){
    let id='';
    if(host==='youtu.be'){
      const parts=url.pathname.split('/').filter(Boolean);id=parts.length===1?parts[0]:'';
    }else if(url.pathname==='/watch')id=url.searchParams.get('v')||'';
    else{
      const parts=url.pathname.split('/').filter(Boolean);
      if(parts.length===2&&['embed','shorts','live'].includes(parts[0]))id=parts[1];
    }
    if(!/^[A-Za-z0-9_-]{11}$/.test(id))return null;
    return {platform:'YouTube',link:'https://www.youtube.com/watch?v='+id,embed:'https://www.youtube-nocookie.com/embed/'+id};
  }
  return null;
}
function normalizedWorkMusic(v){
  const url=String(v.music_url||'').trim();
  if(!url)return {music_url:null,music_title:null,music_artist:null};
  const info=musicEmbedInfo(url);
  if(!info)throw new Error('Gunakan link lagu Spotify atau YouTube yang valid.');
  return {music_url:info.link,music_title:null,music_artist:null};
}
function workSoundtrack(w,forReader=false){
  const info=musicEmbedInfo(w.music_url);
  if(!info)return '';
  const height=info.platform==='Spotify'?'152':'270';
  const src=forReader?'':' src="'+esc(info.embed)+'"';
  return '<div class="work-music-embed '+(info.platform==='YouTube'?'music-youtube':'music-spotify')+'" aria-label="Lagu pendamping karya">'+
    '<iframe data-music-iframe data-music-src="'+esc(info.embed)+'"'+src+
    ' loading="lazy" title="Pemutar '+info.platform+' untuk lagu pendamping karya" height="'+height+
    '" allow="encrypted-media; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>';
}
function setReadingSoundtrack(inReader){
  document.querySelectorAll('[data-music-iframe]').forEach(iframe=>{
    const isReader=!!iframe.closest('[data-reader-overlay]');
    const desired=isReader===inReader;
    const target=iframe.getAttribute('data-music-src');
    if(desired&&target&&iframe.getAttribute('src')!==target)iframe.setAttribute('src',target);
    else if(!desired&&iframe.hasAttribute('src'))iframe.removeAttribute('src');
  });
}


/* Browser-scoped drafts. Shared contributor logins cannot safely own private cloud drafts. */
const draftStorageKey=()=>user()?'athenaeum-work-drafts-v1:'+user().id:null;
function localWorkDrafts(){
  const key=draftStorageKey();if(!key)return [];
  try{const value=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(value)?value.filter(x=>x&&x.id&&x.bookId&&x.fields):[];}
  catch(error){console.warn('Draft lokal tidak dapat dibaca:',error);return [];}
}
function localWorkDraft(id){return localWorkDrafts().find(d=>d.id===id)||null;}
function storeLocalWorkDraft(draft){
  const key=draftStorageKey();if(!key)throw new Error('Masuk sebagai kontributor untuk menyimpan draft.');
  const all=localWorkDrafts().filter(d=>d.id!==draft.id);
  all.unshift(draft);
  try{localStorage.setItem(key,JSON.stringify(all));return true;}
  catch(error){throw new Error('Penyimpanan browser penuh atau tidak tersedia. Salin tulisanmu sebelum menutup halaman.');}
}
function removeLocalWorkDraft(id){
  const key=draftStorageKey();if(!key||!id)return;
  try{localStorage.setItem(key,JSON.stringify(localWorkDrafts().filter(d=>d.id!==id)));}
  catch(error){console.warn('Draft belum dapat dihapus:',error);}
}
const makeWorkDraftId=()=>window.crypto&&crypto.randomUUID?crypto.randomUUID():'draft-'+Date.now()+'-'+Math.random().toString(36).slice(2);
function workEditorFields(w,source){

    {k:'kind',l:'Jenis',t:'sel',o:['Tulisan','Gambar'],v:source?v.kind:(w?w.kind:'Tulisan')},
    {k:'text',l:'Isi tulisan (jika jenis Tulisan)',t:'rich',v:source?v.text:(w?w.text:''),music_url:source?v.music_url:(w?w.music_url:'')},

async function publishWork(values,bookId,workId,draftId){
  if(!isMember())throw new Error('Masuk sebagai kontributor untuk menerbitkan karya.');
  const existing=workId?db.works.find(w=>w.id===workId):null;
  if(workId&&!canManage(existing))throw new Error('Tidak memiliki izin mengedit karya ini.');
  if(!values.title||!values.title.trim()||!values.author||!values.author.trim())throw new Error('Isi judul dan nama penulis/pelukis.');
  const music=normalizedWorkMusic(values);
  if(values.kind==='Gambar'&&!((values.file&&values.file.size)||(existing&&existing.image_path)))throw new Error('Pilih file gambar untuk diterbitkan. File tidak tersimpan di draft browser.');
  let newPath=null;
  try{
    if(values.kind==='Gambar'&&values.file&&values.file.size)newPath=await uploadImage(values.file,'works',1600);
    const data={
      title:values.title.trim(),author_name:values.author.trim(),kind:values.kind,
      text_content:values.kind==='Tulisan'?sanitizeRichHTML(values.text||''):'',
      image_path:values.kind==='Tulisan'?null:(newPath||(existing&&existing.image_path)||null),...music
    };
    const result=existing
      ?await supabase.from('works').update(data).eq('id',existing.id)
      :await supabase.from('works').insert({...data,book_id:bookId,created_by:user().id});
    if(result.error)throw result.error;
  }catch(error){
    if(newPath)await supabase.storage.from(BUCKET).remove([newPath]);
    throw error;
  }
  removeLocalWorkDraft(draftId);
  await refreshData();render();
}
async function openWorkComposer(bookId,workId=null,draft=null){
  if(!isMember())throw new Error('Masuk sebagai kontributor untuk menulis karya.');
  const book=db.books.find(b=>b.id===bookId);
  if(!book)throw new Error('Cover/project draft ini sudah tidak ada.');
  const work=workId?db.works.find(w=>w.id===workId):null;
  if(workId&&!canManage(work))throw new Error('Tidak memiliki izin mengedit karya ini.');
  if(work&&work.bid!==bookId)throw new Error('Lokasi karya tidak sesuai.');
  const opts={workDraft:true,bookId,editWorkId:workId||null,draftId:draft?draft.id:null,existingImage:work?work.img:null};
  const values=await ask(work?'Edit karya':'Tambah karya',workEditorFields(work,draft?draft.fields:null),opts);
  if(!values){render();return;}
  await publishWork(values,bookId,workId,opts.draftId);
}

async function refreshData(){
  loadingError=null;
  const results=await Promise.all([
    supabase.from('folders').select('*').order('created_at',{ascending:true}),
    supabase.from('books').select('*').order('created_at',{ascending:true}),
    supabase.from('works').select('*').order('created_at',{ascending:true}),
    supabase.from('carousel_slides').select('*').order('created_at',{ascending:false}),
    supabase.from('contributors').select('*').order('created_at',{ascending:true})
  ]);
  const failed=results.find(x=>x.error);
  if(failed){loadingError=failed.error.message;throw failed.error;}
  db={folders:(results[0].data||[]).map(mapFolder),books:(results[1].data||[]).map(mapBook),works:(results[2].data||[]).map(mapWork),carousel:(results[3].data||[]).map(mapCarousel),contributors:(results[4].data||[]).map(mapContributor)};
}
async function syncAuth(s){
  session=s||null;profile=null;
  if(!session||!session.user)return;
  const result=await supabase.from('profiles').select('role,status,display_name').eq('id',session.user.id).single();
  if(result.error||!result.data||result.data.status!=='active'){
    await supabase.auth.signOut();
    session=null;profile=null;
    throw new Error(result.error?result.error.message:'Akun belum diaktifkan. Hubungi administrator Athenaeum.');
  }
  profile=result.data;
}

function updateReadingProgress(overlay=document.querySelector('[data-reader-overlay].is-open')){
  if(!overlay||!overlay.classList.contains('is-open'))return;
  const range=Math.max(0,overlay.scrollHeight-overlay.clientHeight);
  const percent=range>0?Math.min(100,Math.max(0,Math.round(overlay.scrollTop/range*100))):100;
  const fill=overlay.querySelector('[data-reading-progress]');
  const label=overlay.querySelector('[data-reading-progress-label]');
  const bar=overlay.querySelector('.reader-progress-track');
  if(fill)fill.style.width=percent+'%';
  if(label)label.textContent=percent+'%';
  if(bar)bar.setAttribute('aria-valuenow',String(percent));
}

function stopHomeShowcase(){
  if(homeShowcaseTimer){clearTimeout(homeShowcaseTimer);homeShowcaseTimer=null;}
}
function mountHomeShowcase(){
  stopHomeShowcase();
  const root=document.querySelector('[data-home-showcase]');
  if(!root)return;
  const slides=Array.from(root.querySelectorAll('.showcase-slide'));
  if(slides.length<2)return;
  const dots=Array.from(root.querySelectorAll('[data-showcase-dot]'));
  const current=root.querySelector('[data-showcase-current]');
  let active=0,paused=false;
  const setSlide=(next)=>{
    active=(next+slides.length)%slides.length;
    slides.forEach((slide,i)=>slide.classList.toggle('is-active',i===active));
    dots.forEach((dot,i)=>{
      dot.classList.toggle('active',i===active);
      if(i===active)dot.setAttribute('aria-current','true');else dot.removeAttribute('aria-current');
    });
    if(current)current.textContent=String(active+1).padStart(2,'0');
  };
  // Slide sambutan tampil 5 detik; setiap slide karya tampil 8 detik.
  const slideDelay=()=>active===0?5000:8000;
  const schedule=(delay=slideDelay())=>{
    stopHomeShowcase();
    if(paused)return;
    homeShowcaseTimer=setTimeout(()=>{
      setSlide(active+1);
      schedule();
    },delay);
  };
  root.querySelectorAll('[data-showcase-prev]').forEach(button=>button.addEventListener('click',()=>{
    setSlide(active-1);schedule();
  }));
  root.querySelectorAll('[data-showcase-next]').forEach(button=>button.addEventListener('click',()=>{
    setSlide(active+1);schedule();
  }));
  dots.forEach((dot,i)=>dot.addEventListener('click',()=>{
    setSlide(i);schedule();
  }));
  root.addEventListener('mouseenter',()=>{paused=true;stopHomeShowcase();});
  root.addEventListener('mouseleave',()=>{paused=false;schedule();});
  root.addEventListener('focusin',()=>{paused=true;stopHomeShowcase();});
  root.addEventListener('focusout',event=>{
    if(!root.contains(event.relatedTarget)){paused=false;schedule();}
  });
  root.addEventListener('touchstart',()=>{paused=true;stopHomeShowcase();},{passive:true});
  root.addEventListener('touchend',()=>{paused=false;schedule();},{passive:true});
  setSlide(0);
  schedule();
}
function validateCarouselUrl(value){
  let url;

  if(url.protocol!=='https:')throw new Error('Tautan harus menggunakan HTTPS.');
  return url.href;

function sanitizeRichHTML(value){
  const raw=String(value??'');
  if(!/<\/?(?:p|div|br|strong|b|em|i|u|s|ul|ol|li|blockquote|h[23])\b/i.test(raw)){
    return esc(raw).replace(/\r\n?|\n/g,'<br>');
  }
  const parsed=new DOMParser().parseFromString(raw,'text/html');
  const allowed=new Set(['p','div','br','strong','b','em','i','u','s','ul','ol','li','blockquote','h2','h3']);
  const clean=node=>{
    if(node.nodeType===3)return esc(node.nodeValue);
    if(node.nodeType!==1)return '';
    const tag=node.tagName.toLowerCase();
    if(['script','style','iframe','object','svg','math'].includes(tag))return '';
    const children=Array.from(node.childNodes).map(clean).join('');
    if(!allowed.has(tag))return children;
    if(tag==='br')return '<br>';
    const alignment=['left','center','right','justify'].includes(node.style.textAlign)?' style="text-align:'+node.style.textAlign+'"':'';
    return '<'+tag+alignment+'>'+children+'</'+tag+'>';
  };
  return Array.from(parsed.body.childNodes).map(clean).join('');
}

    const statusMarkup=workDraft?'<span class="work-draft-status" data-draft-status role="status">'+(options.draftId?'Draft dimuat dari browser ini.':'Autosave aktif · hanya di browser ini')+'</span>':'';
    const workButtons=workDraft?'<button type="button" class="btn" data-work-draft-save>Simpan Draft</button><button type="button" class="btn" data-work-preview>Pratinjau</button>':'';
    const previewMarkup=workDraft?'<section class="publish-preview" data-work-preview-pane hidden aria-label="Pratinjau karya"><div class="publish-preview-toolbar"><span>ATHENAEUM · PREVIEW BEFORE PUBLISHING</span><button type="button" data-work-preview-close>← Kembali ke Editor</button></div><div class="publish-preview-body" data-work-preview-content></div></section>':'';
    d.innerHTML='<form><h2>'+title+'</h2>'+controls+statusMarkup+'<div class="btns '+(workDraft?'work-draft-actions':'')+'"><button type="button" class="btn" id="x">Batal</button>'+workButtons+'<button class="btn pri">'+(workDraft?(options.editWorkId?'Simpan Perubahan':'Publikasikan'):'Simpan')+'</button></div></form>'+previewMarkup;
    d.showModal();
    let savedRichRange=null;
    const richEditor=d.querySelector('[data-rich-editor]');
    const captureRichSelection=()=>{
      if(!richEditor)return;
      const selection=window.getSelection();
      if(!selection||!selection.rangeCount)return;
      const range=selection.getRangeAt(0);
      if(richEditor.contains(range.commonAncestorContainer))savedRichRange=range.cloneRange();
    };
    const restoreRichSelection=()=>{
      if(!richEditor)return false;
      richEditor.focus({preventScroll:true});
      if(!savedRichRange||!richEditor.contains(savedRichRange.commonAncestorContainer))return false;
      const selection=window.getSelection();
      if(!selection)return false;
      selection.removeAllRanges();
      selection.addRange(savedRichRange);
      return true;
    };
    const syncRich=editor=>{
      const hidden=d.querySelector('input[name="'+editor.dataset.richEditor+'"]');
      if(hidden)hidden.value=sanitizeRichHTML(editor.innerHTML);
    };
    const updateWritingCount=()=>{
      if(!richEditor)return;
      const plain=(richEditor.innerText||'').replace(/\u00a0/g,' ').trim();
      const words=plain?plain.split(/\s+/).filter(Boolean).length:0;
      const count=d.querySelector('[data-writing-count]');
      if(count)count.textContent=words+' kata · '+plain.length+' karakter';
    };
    if(richEditor){
      updateWritingCount();
      richEditor.addEventListener('input',()=>{syncRich(richEditor);updateWritingCount();});
      richEditor.addEventListener('mouseup',captureRichSelection);
      richEditor.addEventListener('keyup',captureRichSelection);
      richEditor.addEventListener('touchend',captureRichSelection);
      richEditor.addEventListener('paste',event=>{
        event.preventDefault();
        const plain=event.clipboardData?event.clipboardData.getData('text/plain'):'';
        richEditor.focus();
        document.execCommand('insertText',false,plain);
        syncRich(richEditor);
        updateWritingCount();
        captureRichSelection();
      });
      richEditor.addEventListener('keydown',event=>{
        if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='a'){
          event.preventDefault();
          const range=document.createRange();
          range.selectNodeContents(richEditor);
          const selection=window.getSelection();
          selection.removeAllRanges();
          selection.addRange(range);
          savedRichRange=range.cloneRange();
        }
      });
      document.addEventListener('selectionchange',captureRichSelection);
    }
    d.querySelectorAll('[data-rich-command]').forEach(button=>{
      const preserveSelection=event=>{
        captureRichSelection();
        event.preventDefault();
      };
      button.addEventListener('pointerdown',preserveSelection);
      button.addEventListener('mousedown',preserveSelection);
      button.addEventListener('click',()=>{
        if(!richEditor)return;
        const restored=restoreRichSelection();
        if(!restored)richEditor.focus({preventScroll:true});
        document.execCommand(button.dataset.richCommand,false,null);
        syncRich(richEditor);
        updateWritingCount();
        captureRichSelection();
        if(workDraft)scheduleDraftSave();
      });
    });
    const musicToggle=d.querySelector('[data-music-toggle]');
    const musicFields=d.querySelector('[data-music-fields]');
    if(musicToggle&&musicFields){
      musicToggle.addEventListener('click',()=>{
        const opening=musicFields.hasAttribute('hidden');
        if(opening)musicFields.removeAttribute('hidden');else musicFields.setAttribute('hidden','');
        musicToggle.setAttribute('aria-expanded',String(opening));
        if(opening){const linkInput=musicFields.querySelector('[name="music_url"]');if(linkInput)linkInput.focus({preventScroll:true});}
      });
      const remove=d.querySelector('[data-music-remove]');
      if(remove)remove.addEventListener('click',()=>{
        musicFields.querySelectorAll('input').forEach(input=>input.value='');
        if(workDraft)scheduleDraftSave();
        musicFields.setAttribute('hidden','');
        musicToggle.setAttribute('aria-expanded','false');
      });
    }
    const writingToggle=d.querySelector('[data-writing-toggle]');
    if(writingToggle){
      writingToggle.addEventListener('click',()=>{
        const enabled=!d.classList.contains('writing-mode-open');
        d.classList.toggle('writing-mode-open',enabled);
        writingToggle.textContent=enabled?'Tutup Writing Mode':'Writing Mode ↗';
        if(enabled)richEditor&&richEditor.focus({preventScroll:true});
      });
    }
    let settled=false,dirty=false,autoSaveTimer=null,previewImageUrl=null;
    const form=d.querySelector('form');
    const status=d.querySelector('[data-draft-status]');
    const previewPane=d.querySelector('[data-work-preview-pane]');
    const setDraftStatus=(message,error=false)=>{
      if(status){status.textContent=message;status.classList.toggle('is-error',error);}
    };
    const formValues=()=>{
      d.querySelectorAll('[data-rich-editor]').forEach(syncRich);
      const out={};new FormData(form).forEach((v,k)=>out[k]=v);
      return out;
    };
    const saveDraftFromForm=(force=false)=>{
      if(!workDraft||(!dirty&&!force))return false;
      const v=formValues();
      const content=richEditor?(richEditor.innerText||'').trim():'';
      const meaningful=String(v.title||'').trim()||String(v.author||'').trim()||content||String(v.music_url||'').trim()||(v.file&&v.file.size);
      if(!meaningful)return false;
      const id=options.draftId||makeWorkDraftId();
      const row={id,bookId:options.bookId,editWorkId:options.editWorkId||null,updatedAt:Date.now(),
        fields:{title:String(v.title||''),author:String(v.author||''),kind:String(v.kind||'Tulisan'),
          text:sanitizeRichHTML(v.text||''),music_url:String(v.music_url||'')}};
      storeLocalWorkDraft(row);
      options.draftId=id;
      setDraftStatus('Disimpan otomatis di browser ini · '+new Date(row.updatedAt).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}));
      dirty=false;
      return true;
    };
    const scheduleDraftSave=()=>{
      if(!workDraft||settled)return;
      dirty=true;setDraftStatus('Menyimpan draft...');
      clearTimeout(autoSaveTimer);
      autoSaveTimer=setTimeout(()=>{
        try{saveDraftFromForm();}
        catch(error){setDraftStatus('Gagal menyimpan: '+error.message,true);}
      },750);
    };
    if(workDraft){
      form.addEventListener('input',scheduleDraftSave);
      form.addEventListener('change',scheduleDraftSave);
    }
    const dismissPreview=()=>{
      if(!previewPane||previewPane.hidden)return;
      previewPane.hidden=true;
      d.querySelector('[data-work-preview-content]')?.replaceChildren();
      if(previewImageUrl){URL.revokeObjectURL(previewImageUrl);previewImageUrl=null;}
      d.querySelector('[data-work-preview]')?.focus({preventScroll:true});
    };
    const showPreview=()=>{
      const v=formValues();
      if(previewImageUrl){URL.revokeObjectURL(previewImageUrl);previewImageUrl=null;}
      const title=String(v.title||'').trim()||'Tanpa judul';
      const author=String(v.author||'').trim()||'Nama penulis/pelukis';
      const sound=musicEmbedInfo(v.music_url)?workSoundtrack({music_url:v.music_url}):'';
      let imageHtml='';
      if(v.kind==='Gambar'){
        const image=v.file&&v.file.size?v.file:null;
        const src=image?(previewImageUrl=URL.createObjectURL(image)):options.existingImage;
        if(src)imageHtml='<img src="'+esc(src)+'" alt="'+esc(title)+'">';
        else imageHtml='<p class="empty">Pilih file gambar agar terlihat dalam pratinjau.</p>';
      }
      const textHtml=v.kind==='Tulisan'?sanitizeRichHTML(v.text||''):'';
      d.querySelector('[data-work-preview-content]').innerHTML='<h2>'+esc(title)+'</h2><p class="preview-author">oleh '+esc(author)+'</p>'+sound+'<div class="read">'+imageHtml+textHtml+'</div>';
      previewPane.hidden=false;previewPane.scrollTop=0;
      d.querySelector('[data-work-preview-close]')?.focus({preventScroll:true});
    };
    const onPageHide=()=>{
      if(!workDraft||settled)return;
      clearTimeout(autoSaveTimer);
      try{saveDraftFromForm();}catch(error){console.error('Autosave gagal:',error);}
    };
    const onVisibilityChange=()=>{if(document.visibilityState==='hidden')onPageHide();};
    if(workDraft){
      d.querySelector('[data-work-preview]').addEventListener('click',showPreview);
      d.querySelector('[data-work-preview-close]').addEventListener('click',dismissPreview);
      d.querySelector('[data-work-draft-save]').addEventListener('click',()=>{
        clearTimeout(autoSaveTimer);
        try{
          if(!saveDraftFromForm(true)){setDraftStatus('Isi judul atau tulisan sebelum menyimpan draft.',true);return;}
          const v=formValues();
          if(v.kind==='Gambar'&&v.file&&v.file.size)alert('Draft tersimpan. File gambar tidak ikut disimpan; pilih ulang sebelum publikasi.');
          finish(null);
        }catch(error){setDraftStatus('Gagal menyimpan draft: '+error.message,true);}
      });
      window.addEventListener('pagehide',onPageHide);
      document.addEventListener('visibilitychange',onVisibilityChange);
    }
    const finish=value=>{
      if(settled)return;
      settled=true;clearTimeout(autoSaveTimer);
      if(workDraft){window.removeEventListener('pagehide',onPageHide);document.removeEventListener('visibilitychange',onVisibilityChange);}
      if(richEditor)document.removeEventListener('selectionchange',captureRichSelection);
      if(previewImageUrl)URL.revokeObjectURL(previewImageUrl);
      d.close();resolve(value);
    };
    const cancelEditor=()=>{
      clearTimeout(autoSaveTimer);
      if(workDraft&&dirty){
        try{saveDraftFromForm();}
        catch(error){if(!confirm('Draft gagal disimpan. Tetap keluar? Tulisan yang belum disimpan bisa hilang.'))return;}
      }
      finish(null);
    };
    $('#x').onclick=cancelEditor;
    d.oncancel=e=>{
      e.preventDefault();
      if(previewPane&&!previewPane.hidden){dismissPreview();return;}
      cancelEditor();
    };
    form.onsubmit=e=>{
      e.preventDefault();
      const out=formValues();
      if(d.querySelector('[data-music-fields]')){
        try{normalizedWorkMusic(out);}catch(error){
          alert(error.message);
          const pane=d.querySelector('[data-music-fields]');
          if(pane)pane.removeAttribute('hidden');
          d.querySelector('[data-music-toggle]')?.setAttribute('aria-expanded','true');
          d.querySelector('[name="music_url"]')?.focus({preventScroll:true});
          return;
        }
      }
      if(workDraft&&out.kind==='Gambar'&&!(out.file&&out.file.size)&&!options.existingImage){
        alert('Pilih foto sebelum memublikasikan karya gambar. Data teks draft tetap bisa disimpan.');
        return;
      }
      if(workDraft&&dirty){
        try{saveDraftFromForm();}
        catch(error){
          setDraftStatus('Draft tidak tersimpan. '+error.message,true);
          alert('Autosave tidak berhasil. Coba simpan draft atau salin tulisanmu sebelum memublikasikan.');
          return;
        }
      }
      finish(out);
    };
  });
}

function imageBlob(file,maxSize){
  return new Promise((resolve,reject)=>{
    if(!file||!file.size)return resolve(null);
    const url=URL.createObjectURL(file),image=new Image();
    image.onload=()=>{
      const scale=Math.min(1,maxSize/Math.max(image.width,image.height));
      const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));
      canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('Gagal memproses gambar.')),'image/jpeg',.84);
    };
    image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('File gambar tidak dapat dibaca.'));};
    image.src=url;
  });
}
async function uploadImage(file,kind,maxSize){
  if(!file||!file.size)return null;
  if(!isMember())throw new Error('Silakan masuk terlebih dahulu.');
  const blob=await imageBlob(file,maxSize||1600);
  const id=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
  const path=user().id+'/'+kind+'/'+id+'.jpg';
  const result=await supabase.storage.from(BUCKET).upload(path,blob,{cacheControl:'3600',upsert:false,contentType:'image/jpeg'});
  if(result.error)throw result.error;
  return path;
}

async function readLegacyDB(){
  return new Promise(resolve=>{
    try{
      const request=indexedDB.open('arsip-circle',1);
      request.onsuccess=()=>{
        const legacy=request.result;
        if(!legacy.objectStoreNames.contains('k')){legacy.close();return resolve(null);}
        const get=legacy.transaction('k','readonly').objectStore('k').get('db');
        get.onsuccess=()=>{const value=get.result||null;legacy.close();resolve(value);};
        get.onerror=()=>{legacy.close();resolve(null);};
      };
      request.onerror=()=>resolve(null);
    }catch(e){resolve(null);}
  });
}
async function importLegacy(){
  if(!isAdmin())throw new Error('Hanya admin yang dapat mengimpor arsip.');
  if(!legacyDb||!legacyDb.folders||!legacyDb.folders.length)throw new Error('Tidak ada arsip lokal yang dapat diimpor.');
  if(db.folders.length)throw new Error('Impor otomatis hanya ditawarkan saat arsip cloud masih kosong.');
  if(!confirm('Impor '+legacyDb.folders.length+' folder dari penyimpanan browser ini ke Athenaeum? Data lokal tidak akan dihapus.'))return;
  const folderMap={},bookMap={};
  for(const f of legacyDb.folders){
    const r=await supabase.from('folders').insert({name:f.name,note:f.note||'',created_by:user().id}).select().single();
    if(r.error)throw r.error;folderMap[f.id]=r.data.id;
  }
  for(const b of (legacyDb.books||[])){
    let path=null;
    if(b.img&&String(b.img).startsWith('data:')){
      const blob=await fetch(b.img).then(x=>x.blob());
      const file=new File([blob],'legacy-cover.jpg',{type:blob.type||'image/jpeg'});
      path=await uploadImage(file,'covers',900);
    }
    const r=await supabase.from('books').insert({folder_id:folderMap[b.fid],title:b.title,owner_name:b.owner||'',year:parseInt(b.year,10)||null,cover_path:path,created_by:user().id}).select().single();
    if(r.error)throw r.error;bookMap[b.id]=r.data.id;
  }
  for(const w of (legacyDb.works||[])){
    let path=null;
    if(w.img&&String(w.img).startsWith('data:')){
      const blob=await fetch(w.img).then(x=>x.blob());
      const file=new File([blob],'legacy-work.jpg',{type:blob.type||'image/jpeg'});
      path=await uploadImage(file,'works',1600);
    }
    const r=await supabase.from('works').insert({book_id:bookMap[w.bid],title:w.title,author_name:w.author||'',kind:w.kind||'Tulisan',text_content:w.text||'',image_path:path,created_by:user().id});
    if(r.error)throw r.error;
  }
  await refreshData();render();alert('Arsip lokal berhasil diimpor. Salinan di browser tetap tersimpan.');
}

async function performAction(act,id,t){
  if(act==='login'){
    const v=await ask('Masuk ke Athenaeum',[{k:'role',l:'Jenis akses',t:'sel',o:['Kontributor','Admin']},{k:'password',l:'Kata sandi',t:'password',req:true}]);
    if(!v)return;
    const email=v.role==='Admin'?ADMIN_EMAIL:MEMBER_EMAIL;
    const result=await supabase.auth.signInWithPassword({email,password:v.password});
    if(result.error)throw result.error;
    await syncAuth(result.data.session);
    await refreshData();render();return;
  }
  if(act==='logout'){
    const result=await supabase.auth.signOut();if(result.error)throw result.error;
    session=null;profile=null;render();return;
  }
  if(act==='retry'){await refreshData();render();return;}
  if(act==='import-legacy'){await importLegacy();return;}

  if(act==='add-member'||act==='edit-member'){
    if(act==='add-member'&&!isMember())throw new Error('Masuk sebagai kontributor atau admin untuk menambahkan profil.');
    if(act==='edit-member'&&!isAdmin())throw new Error('Untuk keamanan akun kontributor bersama, hanya admin yang dapat mengedit profil.');
    const existing=act==='edit-member'?db.contributors.find(c=>c.id===id):null;
    if(act==='edit-member'&&!existing)throw new Error('Profil member tidak ditemukan.');
    const values=await ask(existing?'Edit Profil Member':isAdmin()?'Add Member':'Tambah Profil Saya',[
      {k:'name',l:'Nama member / pen name',req:true,v:existing?existing.name:''},
      {k:'creative_role',l:'Peran',t:'sel',o:['Writer','Illustrator','Writer & Illustrator'],v:existing?existing.role:'Writer'},
      {k:'telegram_url',l:'Link Telegram (opsional, contoh: https://t.me/username atau @username)',v:existing?existing.telegram_url:''},
      {k:'file',l:existing?'Ganti foto (opsional)':'Foto member',t:'file'}
    ]);
    if(!values)return;
    const name=String(values.name||'').trim().replace(/\s+/g,' ');
    const telegramUrl=normalizeTelegramUrl(values.telegram_url);
    if(!name||name.length>100)throw new Error('Nama member harus berisi 1 sampai 100 karakter.');
    if(db.contributors.some(c=>c.id!==(existing&&existing.id)&&normalizedContributorName(c.name)===normalizedContributorName(name)))throw new Error('Nama member sudah digunakan. Gunakan nama unik.');
    if(!existing&&(!values.file||!values.file.size))throw new Error('Pilih foto member terlebih dahulu.');
    let newPath=null;
    try{
      if(values.file&&values.file.size)newPath=await uploadImage(values.file,'contributors',1100);
      const payload={name,creative_role:values.creative_role,telegram_url:telegramUrl,photo_path:newPath||(existing&&existing.photo_path)};
      if(existing){
        const result=await supabase.from('contributors').update(payload).eq('id',existing.id).select('id').single();
        if(result.error)throw result.error;
      }else{
        const result=await supabase.from('contributors').insert({...payload,created_by:user().id}).select('id').single();
        if(result.error)throw result.error;
      }
    }catch(error){
      if(newPath)await removeContributorPhoto(newPath);
      throw error;
    }
    if(newPath&&existing&&existing.photo_path)await removeContributorPhoto(existing.photo_path);
    await refreshData();
    if(existing){render();}else{location.hash='contributors';render();}
    return;
  }
  if(act==='delete-member'){
    if(!isAdmin())throw new Error('Hanya admin yang dapat menghapus profil member.');
    const c=db.contributors.find(x=>x.id===id);
    if(!c)throw new Error('Profil member tidak ditemukan.');
    if(!confirm('Hapus profil '+c.name+'? Karya yang sudah diterbitkan tidak akan dihapus.'))return;
    const result=await supabase.from('contributors').delete().eq('id',id).select('id').single();
    if(result.error)throw result.error;
    await removeContributorPhoto(c.photo_path);
    await refreshData();
    location.hash='contributors';render();return;
  }

  if(act==='add-carousel'){
    if(!isAdmin())throw new Error('Hanya admin yang dapat mengelola carousel.');
    const v=await ask('Tambah Carousel',[
      {k:'file',l:'Foto karya',t:'file',req:true},
      {k:'title',l:'Judul karya',req:true},
      {k:'author_name',l:'Nama penulis',req:true},
      {k:'caption',l:'Caption (opsional)',t:'area'},
      {k:'target_url',l:'Link postingan asli (HTTPS)',t:'url',req:true}
    ]);
    if(!v)return;
    if(!v.file||!v.file.size)throw new Error('Pilih foto untuk slide carousel.');
    const targetUrl=validateCarouselUrl(v.target_url);
    const path=await uploadImage(v.file,'carousel',1800);
    const result=await supabase.from('carousel_slides').insert({
      title:v.title.trim(),author_name:v.author_name.trim(),caption:v.caption||'',image_path:path,target_url:targetUrl,created_by:user().id
    }).select().single();
    if(result.error){await supabase.storage.from(BUCKET).remove([path]);throw result.error;}
    await refreshData();render();return;
  }
  if(act==='edit-carousel'){
    if(!isAdmin())throw new Error('Hanya admin yang dapat mengelola carousel.');
    const slide=(db.carousel||[]).find(x=>x.id===id);
    if(!slide)throw new Error('Slide carousel tidak ditemukan.');
    const v=await ask('Edit Carousel',[
      {k:'title',l:'Judul karya',req:true,v:slide.title},
      {k:'author_name',l:'Nama penulis',req:true,v:slide.author_name},
      {k:'caption',l:'Caption (opsional)',t:'area',v:slide.caption},
      {k:'target_url',l:'Link postingan asli (HTTPS)',t:'url',req:true,v:slide.target_url},
      {k:'file',l:'Ganti foto (opsional)',t:'file'}
    ]);
    if(!v)return;
    const targetUrl=validateCarouselUrl(v.target_url);
    const newPath=v.file&&v.file.size?await uploadImage(v.file,'carousel',1800):slide.image_path;
    const result=await supabase.from('carousel_slides').update({
      title:v.title.trim(),author_name:v.author_name.trim(),caption:v.caption||'',target_url:targetUrl,image_path:newPath
    }).eq('id',id);
    if(result.error){
      if(newPath!==slide.image_path)await supabase.storage.from(BUCKET).remove([newPath]);
      throw result.error;
    }
    if(newPath!==slide.image_path)await removeCarouselImage(slide.image_path);
    await refreshData();render();return;
  }
  if(act==='delete-carousel'){
    if(!isAdmin())throw new Error('Hanya admin yang dapat mengelola carousel.');
    const slide=(db.carousel||[]).find(x=>x.id===id);
    if(!slide)throw new Error('Slide carousel tidak ditemukan.');
    if(!confirm('Hapus slide "'+slide.title.replace(/["']/g,'')+'" dari homepage?'))return;
    const result=await supabase.from('carousel_slides').delete().eq('id',id);
    if(result.error)throw result.error;
    await removeCarouselImage(slide.image_path);
    await refreshData();render();return;
  }

  if(act==='addf'){
    if(!isAdmin())throw new Error('Hanya admin yang dapat membuat folder/project.');
    const v=await ask('Project baru',[{k:'name',l:'Nama project',req:true},{k:'note',l:'Catatan singkat (opsional)',t:'area'}]);
    if(!v)return;
    const r=await supabase.from('folders').insert({name:v.name,note:v.note||'',created_by:user().id}).select().single();
    if(r.error)throw r.error;
    await refreshData();if(t==='f')location.hash='f/'+r.data.id;else render();return;
  }
  if(act==='addb'){
    if(!isMember())throw new Error('Masuk sebagai kontributor untuk menambahkan cover.');
    const v=await ask('Cover baru',[{k:'title',l:'Judul cover',req:true},{k:'cover_artist',l:'Cover dibuat/digambar oleh',req:true},{k:'year',l:'Tahun'},{k:'file',l:'Gambar cover',t:'file'}]);
    if(!v)return;
    const path=await uploadImage(v.file,'covers',900);
    const year=parseInt(v.year,10)||null;
    const r=await supabase.from('books').insert({folder_id:id,title:v.title,owner_name:'Athenaeum',cover_artist:v.cover_artist,year:year,cover_path:path,created_by:user().id});
    if(r.error){if(path)await supabase.storage.from(BUCKET).remove([path]);throw r.error;}
    await refreshData();render();return;
  }
  if(act==='addw'){
    await openWorkComposer(id);
    return;
  }
  if(act==='resume-draft'){
    if(!isMember())throw new Error('Masuk dahulu untuk melanjutkan draft.');
    const draft=localWorkDraft(id);
    if(!draft)throw new Error('Draft ini tidak ditemukan di browser yang sedang dipakai.');
    await openWorkComposer(draft.bookId,draft.editWorkId||null,draft);
    return;
  }
  if(act==='delete-draft'){
    if(!isMember())throw new Error('Masuk dahulu untuk menghapus draft.');
    const draft=localWorkDraft(id);
    if(!draft)return;
    if(!confirm('Hapus draft "'+(draft.fields.title||'Tanpa judul')+'"? Tindakan ini tidak dapat dibatalkan.'))return;
    removeLocalWorkDraft(id);
    render();
    return;
  }
  if(act==='editb'){
    const b=db.books.find(x=>x.id===id);if(!canManage(b))throw new Error('Anda tidak memiliki izin mengubah cover ini.');
    const v=await ask('Edit cover',[{k:'title',l:'Judul cover',req:true,v:b.title},{k:'cover_artist',l:'Cover dibuat/digambar oleh',req:true,v:b.cover_artist},{k:'year',l:'Tahun',v:b.year},{k:'file',l:'Ganti gambar cover (opsional)',t:'file'}]);
    if(!v)return;
    const path=v.file&&v.file.size?await uploadImage(v.file,'covers',900):b.cover_path;
    const r=await supabase.from('books').update({title:v.title,owner_name:'Athenaeum',cover_artist:v.cover_artist,year:parseInt(v.year,10)||null,cover_path:path}).eq('id',id);
    if(r.error)throw r.error;
    await refreshData();render();return;
  }
  if(act==='editw'){
    const work=db.works.find(w=>w.id===id);
    if(!canManage(work))throw new Error('Anda tidak memiliki izin mengubah karya ini.');
    await openWorkComposer(work.bid,work.id);
    return;
  }

  if(act==='delf'){
    if(!isAdmin())throw new Error('Hanya admin yang dapat menghapus folder.');
    if(!confirm('Hapus folder beserta semua cover dan karya di dalamnya?'))return;
    const books=db.books.filter(b=>b.fid===id),bookIds=books.map(b=>b.id);
    if(bookIds.length){const w=await supabase.from('works').delete().in('book_id',bookIds);if(w.error)throw w.error;}
    const b=await supabase.from('books').delete().eq('folder_id',id);if(b.error)throw b.error;
    const f=await supabase.from('folders').delete().eq('id',id);if(f.error)throw f.error;
    await refreshData();location.hash='';render();return;
  }
  if(act==='delb'){
    const b=db.books.find(x=>x.id===id);if(!canManage(b))throw new Error('Anda tidak memiliki izin menghapus cover ini.');
    if(!confirm('Hapus cover beserta seluruh karyanya?'))return;
    const w=await supabase.from('works').delete().eq('book_id',id);if(w.error)throw w.error;
    const r=await supabase.from('books').delete().eq('id',id);if(r.error)throw r.error;
    await refreshData();location.hash='f/'+b.fid;render();return;
  }
  if(act==='delw'){
    const w=db.works.find(x=>x.id===id);if(!canManage(w))throw new Error('Anda tidak memiliki izin menghapus karya ini.');
    if(!confirm('Hapus karya ini?'))return;
    const r=await supabase.from('works').delete().eq('id',id);if(r.error)throw r.error;
    await refreshData();location.hash='b/'+w.bid;render();return;
  }
}

document.addEventListener('click',async e=>{
  const viewButton=e.target.closest('[data-library-mode]');
  if(viewButton){e.preventDefault();switchLibraryView(viewButton);return;}
  const echoButton=e.target.closest('[data-echo-reaction]');
  if(echoButton){e.preventDefault();await toggleWorkEcho(echoButton);return;}
  const collections=e.target.closest('[data-scroll-collections]');
  if(collections){
    const scrollToCollections=()=>requestAnimationFrame(()=>document.querySelector('#home-collections')?.scrollIntoView({behavior:'smooth',block:'start'}));
    if(location.hash){
      window.addEventListener('hashchange',scrollToCollections,{once:true});
      location.hash='';
    }else scrollToCollections();
    return;
  }
  const readAction=e.target.closest('[data-reading-action]');
  if(readAction){
    const overlay=readAction.closest('[data-reader-overlay]')||document.querySelector('[data-reader-overlay]');
    if(!overlay)return;
    const action=readAction.dataset.readingAction;
    if(action==='open'){
      overlay.classList.add('is-open');
      setReadingSoundtrack(true);
      requestAnimationFrame(()=>updateReadingProgress(overlay));
      document.body.classList.add('reading-mode-active');
      const closeButton=overlay.querySelector('[data-reading-action="close"]');
      if(closeButton)closeButton.focus({preventScroll:true});
    }else if(action==='close'){
      setReadingSoundtrack(false);
      overlay.classList.remove('is-open');
      document.body.classList.remove('reading-mode-active');
    }else if(action==='smaller'||action==='larger'){
      const current=parseInt(getComputedStyle(overlay).getPropertyValue('--reader-size'),10)||20;
      const next=Math.max(16,Math.min(30,current+(action==='larger'?2:-2)));
      overlay.style.setProperty('--reader-size',next+'px');
      requestAnimationFrame(()=>updateReadingProgress(overlay));
    }else if(action==='width'){
      overlay.classList.toggle('reader-wide');
      readAction.textContent=overlay.classList.contains('reader-wide')?'Lebar: Luas':'Lebar teks';
      requestAnimationFrame(()=>updateReadingProgress(overlay));
    }else if(action==='theme'){
      const themes=['paper','sepia','night'];
      const labels={paper:'Tema: Kertas',sepia:'Tema: Sepia',night:'Tema: Malam'};
      const next=themes[(themes.indexOf(overlay.dataset.theme)+1)%themes.length];
      overlay.dataset.theme=next;
      readAction.textContent=labels[next];
    }
    return;
  }
  const g=e.target.closest('[data-go]');
  if(g){location.hash=g.dataset.go;return;}
  const a=e.target.closest('[data-act]');
  if(!a)return;
  try{await performAction(a.dataset.act,a.dataset.draftId||a.dataset.slideId||location.hash.slice(1).split('/')[1],location.hash.slice(1).split('/')[0]);}
  catch(error){console.error(error);alert(error.message||'Terjadi kesalahan.');}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    const overlay=document.querySelector('[data-reader-overlay].is-open');
    if(overlay){
      setReadingSoundtrack(false);
      overlay.classList.remove('is-open');
      document.body.classList.remove('reading-mode-active');
    }
  }
  if(e.key==='Enter'&&e.target.matches('[data-go],[data-act]'))e.target.click();
});
window.addEventListener('hashchange',render);
function showBootError(message){
  const app=$('#app');
  if(!app)return;
  app.innerHTML='<div class="stage"><div class="folder"><div class="top"><h1>Athenaeum<small>arsip belum dapat dibuka</small></h1></div><p class="empty">'+esc(message||'Koneksi belum berhasil.')+'</p><button class="btn pri" type="button" onclick="location.reload()">Muat ulang</button></div></div>';
}
let createSupabaseClient=null;
async function loadSupabaseSDK(){
  const src='https://esm.sh/@supabase/supabase-js@2?bundle';
  try{
    const sdk=await import(src);
    if(sdk&&typeof sdk.createClient==='function'){
      createSupabaseClient=sdk.createClient;
      return;
    }
    throw new Error('Fungsi createClient tidak ditemukan pada modul Supabase.');
  }catch(error){
    console.error('Supabase SDK gagal dimuat:',error);
    throw new Error('Pustaka koneksi gagal dimuat. Periksa koneksi internet lalu coba lagi.');
  }
}
render();
(async function init(){
  try{
    await loadSupabaseSDK();
    supabase=createSupabaseClient(SB_URL,SB_KEY);
    supabase.auth.onAuthStateChange((event,newSession)=>{
      if(event==='SIGNED_OUT'){
        session=null;profile=null;render();
      }
    });
    const result=await supabase.auth.getSession();
    await syncAuth(result.data.session);
    await refreshData();
    dataReady=true;
    render();
    if(isAdmin()){
      readLegacyDB().then(value=>{
        legacyDb=value;
        if(value&&value.folders&&value.folders.length&&!db.folders.length)render();
      });
    }
  }catch(error){
    console.error(error);
    loadingError=error.message||'Gagal menghubungkan ke Supabase.';
    showBootError(loadingError);
  }
})();
